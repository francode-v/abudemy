  # -------------------------------------------------------------- Assistance
  /api/v1/assistance/contacts:
    get:
      tags: [Assistance]
      summary: List the caller's trusted contacts
      responses:
        "200":
          description: Contacts
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/TrustedContact" }
    post:
      tags: [Assistance]
      summary: Create a trusted contact
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrustedContactInput" }
      responses:
        "201":
          description: Created contact
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrustedContact" }
        "400": { $ref: "#/components/responses/ValidationError" }
  /api/v1/assistance/contacts/{id}:
    put:
      tags: [Assistance]
      summary: Update a trusted contact
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrustedContactInput" }
      responses:
        "200":
          description: Updated contact
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrustedContact" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [Assistance]
      summary: Delete a trusted contact
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/assistance/requests:
    get:
      tags: [Assistance]
      summary: List assistance requests (own, or all for administrators)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, notified, resolved, cancelled] } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated requests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/AssistanceRequest" }
    post:
      tags: [Assistance]
      summary: Create an assistance request
      description: |
        Notifies the caller's trusted contacts through the configured provider.
        When no provider is configured, each attempt is recorded with status
        `skipped` and the request is **not** marked as notified: the API never
        reports a delivery that did not happen.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type: { type: string, example: medical }
                description: { type: string }
                latitude: { type: number }
                longitude: { type: number }
                contact_id: { type: string, format: uuid }
      responses:
        "201":
          description: Created request with notification attempts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistanceRequest" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/assistance/requests/{id}:
    get:
      tags: [Assistance]
      summary: Get an assistance request
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistanceRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/assistance/requests/{id}/status:
    patch:
      tags: [Assistance]
      summary: Update an assistance request's status
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [pending, notified, resolved, cancelled] }
      responses:
        "200":
          description: Updated request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistanceRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ----------------------------------------------------------- Organizations
  /api/v1/organizations:
    get:
      tags: [Organizations]
      summary: List organizations (all for administrators, own memberships otherwise)
      parameters:
        - { name: type, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
        - { name: active, in: query, schema: { type: boolean } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated organizations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Organization" }
    post:
      tags: [Organizations]
      summary: Create an organization (institutional roles)
      description: The creator becomes the organization owner.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationInput" }
      responses:
        "201":
          description: Created organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/organizations/mine:
