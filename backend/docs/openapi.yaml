      tags: [Organizations]
      summary: List the caller's organizations with their role
      responses:
        "200":
          description: Memberships
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        organization: { $ref: "#/components/schemas/Organization" }
                        role: { type: string, enum: [owner, admin, editor, viewer] }
  /api/v1/organizations/{id}:
    get:
      tags: [Organizations]
      summary: Get an organization
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [Organizations]
      summary: Update an organization
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationInput" }
      responses:
        "200":
          description: Updated organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/organizations/{id}/members:
    get:
      tags: [Organizations]
      summary: List organization members
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/OrganizationMember" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Organizations]
      summary: Add a member by user id or email
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id: { type: string, format: uuid }
                email: { type: string, format: email }
                role: { type: string, enum: [owner, admin, editor, viewer] }
      responses:
        "201":
          description: Added member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationMember" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/organizations/{id}/members/{userId}:
    patch:
      tags: [Organizations]
      summary: Update a member's role
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [owner, admin, editor, viewer] }
      responses:
        "204": { description: Updated }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [Organizations]
      summary: Remove a member
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Removed }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  # -------------------------------------------------------------- Analytics
  /api/v1/analytics/overview:
    get:
      tags: [Analytics]
      summary: Aggregate indicators for the institutional dashboard
      parameters:
        - { name: organization_id, in: query, description: Restrict to one organization, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyticsOverview" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/analytics/reports:
    get:
      tags: [Analytics]
      summary: List available report identifiers
      responses:
        "200":
          description: Reports
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { type: string }
                  formats:
                    type: array
                    items: { type: string }
  /api/v1/analytics/reports/{type}:
    get:
      tags: [Analytics]
      summary: Export a dataset as CSV or preview it as JSON
      description: |
        Whitelisted dataset types: `services`, `activities`, `enrollments`,
        `assistance`, `opportunities`, `territorial`. `format=json` returns a bounded
        preview (first 200 rows) for on-screen display. `format=pdf` returns 501.
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [services, activities, enrollments, assistance, opportunities, territorial]
        - { name: organization_id, in: query, schema: { type: string, format: uuid } }
        - { name: format, in: query, schema: { type: string, enum: [csv, json, pdf], default: csv } }
      responses:
        "200":
          description: CSV file, or a JSON preview when `format=json`
          content:
            text/csv:
              schema: { type: string }
            application/json:
              schema: { $ref: "#/components/schemas/ReportPreview" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  # -------------------------------------------------------------- Preferences
  /api/v1/users/me/preferences:
    get:
      tags: [Users]
      summary: Get the caller's preferences
      description: |
        Returns the caller's stored preferences. When nothing has been stored
        yet, empty defaults are returned and nothing is persisted.
      responses:
        "200":
          description: Preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPreferences" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [Users]
      summary: Replace the caller's preferences
      description: |
        Interests are trimmed and de-duplicated (case-insensitively). At most 30
        interests of up to 60 characters each are accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserPreferencesInput" }
      responses:
        "200":
          description: Stored preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPreferences" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/users/me/email:
    post:
      tags: [Users]
      summary: Change the caller's email
      description: |
        Requires the current password. The email is normalized to lower case and
        must not already belong to another account (409 otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeEmailInput" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/users/me/applications:
    get:
      tags: [Opportunities]
      summary: List the caller's opportunity applications
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Applications with the opportunity summary expanded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Application" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/users/me/reminders:
    get:
      tags: [Activities]
      summary: List the caller's activity reminders
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Reminders
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/ActivityReminder" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # --------------------------------------------------------------- Reminders
  /api/v1/activities/{id}/reminders:
    post:
      tags: [Activities]
      summary: Set a reminder for an activity
      description: |
        Creates or revives the caller's reminder. Without `remind_at` the
        reminder defaults to 24 hours before the activity starts. Delivery
        depends on a scheduler and a configured notification provider; without
        them the reminder is stored but nothing is sent.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReminderInput" }
      responses:
        "201":
          description: Reminder created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityReminder" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/activities/{id}/reminders/me:
    delete:
      tags: [Activities]
      summary: Cancel the caller's reminder for an activity
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204": { description: Reminder cancelled }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- Reports
  /api/v1/opportunities/{id}/reports:
    post:
      tags: [Opportunities]
      summary: Report a suspicious opportunity
      description: A user may report an opportunity only once (409 on retry).
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportInput" }
      responses:
        "201":
          description: Report recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpportunityReport" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ---------------------------------------------------------------- Devices
  /api/v1/devices:
    get:
      tags: [Notifications]
      summary: List the caller's active push devices
      responses:
        "200":
          description: Devices
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Device" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Notifications]
      summary: Register (or refresh) a push device
      description: |
        Tokens are unique. Re-registering the same token revives it and moves it
        to the current user.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceInput" }
      responses:
        "201":
          description: Device registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/devices/{id}:
    delete:
      tags: [Notifications]
      summary: Revoke a push device
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204": { description: Device revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ------------------------------------------------------------ Notifications
  /api/v1/notifications:
    get:
      tags: [Notifications]
      summary: List the caller's in-app notifications
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Notification" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/notifications/unread-count:
    get:
      tags: [Notifications]
      summary: Count the caller's unread notifications
      responses:
        "200":
          description: Unread count
          content:
            application/json:
              schema:
                type: object
                properties:
                  unread: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/notifications/read-all:
    post:
      tags: [Notifications]
      summary: Mark every unread notification as read
      responses:
        "200":
          description: Number of notifications updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/notifications/{id}/read:
    post:
      tags: [Notifications]
      summary: Mark one notification as read
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204": { description: Notification marked as read }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # -------------------------------------------------------------- Assistant
  /api/v1/assistant/topics:
    get:
      tags: [Assistant]
      summary: List the curated help topics
      description: |
        The assistant is backed by a curated, non-AI knowledge base. It never
        replaces medical or emergency professionals.
      responses:
        "200":
          description: Help topics
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AssistantTopic" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/assistant/answer:
    get:
      tags: [Assistant]
      summary: Ask the assistant a question
      description: |
        Answers come from the curated knowledge base (`source: knowledge_base`,
        `ai: false`) or, when configured, an external provider
        (`source: provider`, `ai: true`). Unmatched questions return an honest
        fallback rather than an invented answer.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Answer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantAnswer" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # --------------------------------------------------------------------- Geo
  /api/v1/geo/search:
    get:
      tags: [Geo]
      summary: Forward geocoding (place name to coordinates)
      description: |
        Requires `GEOCODE_PROVIDER=nominatim`. Without a provider the endpoint
        returns 501 instead of inventing coordinates.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, maxLength: 200 }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 20, default: 5 } }
      responses:
        "200":
          description: Matches
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/GeoResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /api/v1/geo/reverse:
    get:
      tags: [Geo]
      summary: Reverse geocoding (coordinates to a place label)
      description: Requires `GEOCODE_PROVIDER=nominatim`; 501 otherwise.
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lng, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
      responses:
        "200":
          description: Place label
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GeoResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  # ---------------------------------------------------------------- Payments
  /api/v1/payments/config:
    get:
      tags: [Payments]
      summary: Report the online payments capability
      description: |
        No payment provider is enabled by default, so the platform honestly
        reports payments as unavailable and never fakes a checkout.
      responses:
        "200":
          description: Payments capability
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentsConfig" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/payments/intents:
    post:
      tags: [Payments]
      summary: Create a payment intent
      description: Returns 501 while no payment provider is configured.
      responses:
        "501": { $ref: "#/components/responses/NotImplemented" }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    ValidationError:
      description: The request payload is invalid
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: Authentication is missing or invalid
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: The caller is authenticated but not allowed to perform this action
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: The resource does not exist
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: The operation conflicts with the current state
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotImplemented:
      description: The requested capability is not implemented yet
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: validation_error }
            message: { type: string }
            fields:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }
    PageMeta:
      type: object
      properties:
        pagination:
          type: object
          properties:
            page: { type: integer }
            per_page: { type: integer }
            total: { type: integer }
            total_pages: { type: integer }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        full_name: { type: string }
        phone: { type: string }
        birth_date: { type: string, format: date, nullable: true }
        comuna: { type: string }
        health_system:
          type: string
          enum: [fonasa, isapre, capredena, dipreca, private, other]
        sex:
          type: string
          enum: [female, male, other, prefer_not_to_say]
        living_situation:
          type: string
          enum:
            - alone
            - with_partner
            - with_children
            - with_partner_and_children
            - with_family
            - with_caregiver
            - other
        role: { type: string, enum: [mobile_user, institutional_client, org_collaborator, admin] }
        status: { type: string, enum: [active, inactive, suspended] }
        institutional_approved:
          type: boolean
          description: |
            Whether an `institutional_client` may use the institutional portal.
            Always true for the other roles.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_login_at: { type: string, format: date-time, nullable: true }
    Session:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        user_agent: { type: string }
        ip_address: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time, nullable: true }
        current: { type: boolean }
    TokenPair:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, description: Access token lifetime in seconds }
        session_id: { type: string, format: uuid }
        user: { $ref: "#/components/schemas/User" }
    ServiceCategory:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
    ScheduleEntry:
      type: object
      properties:
        day_of_week: { type: integer, minimum: 0, maximum: 6, description: 0=Sunday }
        opens_at: { type: string, example: "09:00" }
        closes_at: { type: string, example: "13:00" }
    Service:
      type: object
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid, nullable: true }
        organization_name: { type: string, description: Organization that provides the service }
        category_id: { type: string, format: uuid, nullable: true }
        category: { $ref: "#/components/schemas/ServiceCategory" }
        name: { type: string }
        description: { type: string }
        type: { type: string, enum: [establishment, resource] }
        status: { type: string, enum: [active, inactive, draft] }
        address: { type: string }
        comuna: { type: string }
        region: { type: string }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        phone: { type: string }
        email: { type: string }
        website: { type: string }
        schedule:
          type: array
          items: { $ref: "#/components/schemas/ScheduleEntry" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ServiceInput:
      type: object
      required: [name]
      properties:
        organization_id: { type: string, format: uuid, nullable: true }
        category_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        description: { type: string }
        type: { type: string, enum: [establishment, resource] }
        status: { type: string, enum: [active, inactive, draft] }
        address: { type: string }
        comuna: { type: string }
        region: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        phone: { type: string }
        email: { type: string }
        website: { type: string }
        schedule:
          type: array
          items: { $ref: "#/components/schemas/ScheduleEntry" }
    Activity:
      type: object
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid, nullable: true }
        service_id: { type: string, format: uuid, nullable: true }
        category_id: { type: string, format: uuid, nullable: true }
        title: { type: string }
        description: { type: string }
        type: { type: string, enum: [workshop, event, course, support_group] }
        modality: { type: string, enum: [in_person, online, hybrid] }
        status: { type: string, enum: [draft, published, cancelled, finished] }
        location: { type: string }
        comuna: { type: string }
        region: { type: string }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time, nullable: true }
        capacity: { type: integer }
        enrolled_count: { type: integer }
        price: { type: number }
        currency: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ActivityInput:
      type: object
      required: [title, start_at]
      properties:
        organization_id: { type: string, format: uuid, nullable: true }
        service_id: { type: string, format: uuid, nullable: true }
        category_id: { type: string, format: uuid, nullable: true }
        title: { type: string }
        description: { type: string }
        type: { type: string, enum: [workshop, event, course, support_group] }
        modality: { type: string, enum: [in_person, online, hybrid] }
        status: { type: string, enum: [draft, published, cancelled, finished] }
        location: { type: string }
        comuna: { type: string }
        region: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        capacity: { type: integer, minimum: 0 }
        price: { type: number, minimum: 0 }
        currency: { type: string }
    Enrollment:
      type: object
      properties:
        id: { type: string, format: uuid }
        activity_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        status: { type: string, enum: [enrolled, waitlist, cancelled, attended] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        activity_title: { type: string }
        user_email: { type: string }
        user_full_name: { type: string }
    Skill:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        level: { type: string, enum: [beginner, intermediate, advanced, expert] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SkillInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        level: { type: string, enum: [beginner, intermediate, advanced, expert] }
    Offering:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        skill_id: { type: string, format: uuid, nullable: true }
        title: { type: string }
        description: { type: string }
        type: { type: string, enum: [class, service] }
        status: { type: string, enum: [draft, active, inactive] }
        modality: { type: string, enum: [in_person, online, hybrid] }
        price: { type: number }
        currency: { type: string }
        comuna: { type: string }
        region: { type: string }
    OfferingInput:
      type: object
      required: [title]
      properties:
        skill_id: { type: string, format: uuid, nullable: true }
        title: { type: string }
        description: { type: string }
        type: { type: string, enum: [class, service] }
        status: { type: string, enum: [draft, active, inactive] }
        modality: { type: string, enum: [in_person, online, hybrid] }
        price: { type: number, minimum: 0 }
        currency: { type: string }
        comuna: { type: string }
        region: { type: string }
    Opportunity:
      type: object
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid, nullable: true }
        title: { type: string }
        description: { type: string }
        type: { type: string, enum: [job, gig, volunteer, economic] }
        status: { type: string, enum: [draft, open, closed] }
        comuna: { type: string }
        region: { type: string }
        salary_min: { type: number, nullable: true }
        salary_max: { type: number, nullable: true }
        currency: { type: string }
        contact_email: { type: string }
        expires_at: { type: string, format: date-time, nullable: true }
    OpportunityInput:
      type: object
      required: [title]
      properties:
        organization_id: { type: string, format: uuid, nullable: true }
        title: { type: string }
        description: { type: string }
        type: { type: string, enum: [job, gig, volunteer, economic] }
        status: { type: string, enum: [draft, open, closed] }
        comuna: { type: string }
        region: { type: string }
        salary_min: { type: number }
        salary_max: { type: number }
        currency: { type: string }
        contact_email: { type: string, format: email }
        expires_at: { type: string, format: date-time }
    Application:
      type: object
      properties:
        id: { type: string, format: uuid }
        opportunity_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        message: { type: string }
        status: { type: string, enum: [applied, accepted, rejected] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        opportunity_title: { type: string, description: Populated when listing the caller's own applications }
        opportunity_status: { type: string, enum: [draft, open, closed] }
        opportunity_type: { type: string, enum: [job, gig, volunteer, economic] }
        comuna: { type: string }
        region: { type: string }
    TrustedContact:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        name: { type: string }
        relationship: { type: string }
        phone: { type: string }
        email: { type: string }
        priority: { type: integer }
    TrustedContactInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        relationship: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        priority: { type: integer, minimum: 1, maximum: 10 }
    AssistanceRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        type: { type: string }
        description: { type: string }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        status: { type: string, enum: [pending, notified, resolved, cancelled] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true }
        notifications:
          type: array
          items: { $ref: "#/components/schemas/AssistanceNotification" }
    AssistanceNotification:
      type: object
      properties:
        id: { type: string, format: uuid }
        assistance_request_id: { type: string, format: uuid }
        contact_id: { type: string, format: uuid, nullable: true }
        channel: { type: string, enum: [sms, email] }
        recipient: { type: string }
        provider: { type: string }
        status: { type: string, enum: [pending, sent, failed, skipped] }
        error: { type: string }
        sent_at: { type: string, format: date-time, nullable: true }
    Organization:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [health, community, ngo, employer, government, educational, other] }
        legal_id: { type: string }
        description: { type: string }
        email: { type: string }
        phone: { type: string }
        address: { type: string }
        comuna: { type: string }
        region: { type: string }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        active: { type: boolean }
    OrganizationInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        type: { type: string, enum: [health, community, ngo, employer, government, educational, other] }
        legal_id: { type: string }
        description: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        address: { type: string }
        comuna: { type: string }
        region: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        active: { type: boolean }
    OrganizationMember:
      type: object
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        role: { type: string, enum: [owner, admin, editor, viewer] }
        user_email: { type: string }
        user_full_name: { type: string }
        created_at: { type: string, format: date-time }
    AnalyticsOverview:
      type: object
      properties:
        services_total: { type: integer }
        services_active: { type: integer }
        activities_total: { type: integer }
        activities_published: { type: integer }
        activities_upcoming: { type: integer }
        enrollments_total: { type: integer }
        enrollments_active: { type: integer }
        users_total: { type: integer }
        users_mobile: { type: integer }
        organizations_total: { type: integer }
        opportunities_open: { type: integer }
        assistance_total: { type: integer }
        assistance_pending: { type: integer }
        average_occupancy: { type: number, description: Mean enrolled/capacity ratio across activities with capacity }
        services_by_category:
          type: array
          items: { $ref: "#/components/schemas/CountByLabel" }
        activities_by_type:
          type: array
          items: { $ref: "#/components/schemas/CountByLabel" }
        territorial_distribution:
          type: array
          items:
            type: object
            properties:
              comuna: { type: string }
              region: { type: string }
              count: { type: integer }
    CountByLabel:
      type: object
      properties:
        label: { type: string }
        count: { type: integer }
    ReportPreview:
      type: object
      description: Bounded JSON preview of a report, used by the on-screen table.
      properties:
        type: { type: string }
        headers:
          type: array
          items: { type: string }
        rows:
          type: array
          items:
            type: array
            items: { type: string }
        total: { type: integer, description: Total rows in the full dataset }
        truncated: { type: boolean, description: True when only the first 200 rows are included }
    AccessibilityPreferences:
      type: object
      description: Display/accessibility toggles that follow the user across devices.
      properties:
        large_text: { type: boolean }
        high_contrast: { type: boolean }
        reduce_motion: { type: boolean }
        screen_reader: { type: boolean }
    NotificationPreferences:
      type: object
      description: Notification opt-ins stored for the user.
      properties:
        activity_reminders: { type: boolean }
        assistance: { type: boolean }
        opportunities: { type: boolean }
        courses: { type: boolean }
    UserPreferences:
      type: object
      properties:
        interests:
          type: array
          items: { type: string }
        accessibility: { $ref: "#/components/schemas/AccessibilityPreferences" }
        notifications: { $ref: "#/components/schemas/NotificationPreferences" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    UserPreferencesInput:
      type: object
      properties:
        interests:
          type: array
          maxItems: 30
          items: { type: string, maxLength: 60 }
        accessibility: { $ref: "#/components/schemas/AccessibilityPreferences" }
        notifications: { $ref: "#/components/schemas/NotificationPreferences" }
    ChangeEmailInput:
      type: object
      required: [new_email, password]
      properties:
        new_email: { type: string, format: email }
        password: { type: string, description: The caller's current password }
    ActivityReminder:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        activity_id: { type: string, format: uuid }
        remind_at: { type: string, format: date-time }
        status: { type: string, enum: [pending, cancelled, sent, skipped] }
        activity_title: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ReminderInput:
      type: object
      properties:
        remind_at: { type: string, format: date-time, description: Defaults to 24 hours before the activity starts }
    OpportunityReport:
      type: object
      properties:
        id: { type: string, format: uuid }
        opportunity_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        reason: { type: string }
        details: { type: string }
        status: { type: string, enum: [open, reviewing, dismissed, actioned] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ReportInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string, maxLength: 120 }
        details: { type: string, maxLength: 2000 }
    Device:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        platform: { type: string, enum: [ios, android, web] }
        token: { type: string }
        device_name: { type: string }
        app_version: { type: string }
        last_seen_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DeviceInput:
      type: object
      required: [token]
      properties:
        platform: { type: string, enum: [ios, android, web], default: android }
        token: { type: string, maxLength: 512 }
        device_name: { type: string, maxLength: 120 }
        app_version: { type: string, maxLength: 40 }
    Notification:
      type: object
      description: |
        In-app notification. `push_status` records the honest push delivery
        attempt: without a configured provider nothing is sent and the attempt
        is `skipped`.
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        kind: { type: string, example: application_status }
        title: { type: string }
        body: { type: string }
        data: { type: object, additionalProperties: true }
        read_at: { type: string, format: date-time, nullable: true }
        push_status: { type: string, enum: [pending, sent, failed, skipped] }
        push_provider: { type: string }
        push_error: { type: string }
        created_at: { type: string, format: date-time }
    AssistantTopic:
      type: object
      properties:
        slug: { type: string }
        title: { type: string }
        keywords:
          type: array
          items: { type: string }
        answer: { type: string }
        related:
          type: array
          items: { type: string }
    AssistantAnswer:
      type: object
      properties:
        question: { type: string }
        answer: { type: string }
        topic: { type: string }
        source: { type: string, enum: [knowledge_base, provider] }
        ai: { type: boolean, description: True only when an external AI provider produced the answer }
        related:
          type: array
          items: { $ref: "#/components/schemas/AssistantTopic" }
    GeoResult:
      type: object
      properties:
        label: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        type: { type: string }
        country: { type: string }
        region: { type: string }
        comuna: { type: string }
    PaymentsConfig:
      type: object
      properties:
        provider: { type: string, example: none }
        available: { type: boolean }
        message: { type: string }
