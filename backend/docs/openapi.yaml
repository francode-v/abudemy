openapi: 3.0.3
info:
  title: Abudemy API
  version: 1.0.0
  description: |
    Shared REST API for the Abudemy mobile application (older adults) and the
    institutional web platform. Both clients consume the same API and the same
    PostgreSQL datastore.

    ## Authentication
    Every endpoint except `POST /api/v1/auth/*`, `GET /healthz` and `GET /readyz`
    requires a Bearer access token obtained from `POST /api/v1/auth/login`.
    Refresh tokens are rotated on every use; access tokens are short lived and
    are invalidated when their session is revoked.

    ## Authorization
    Roles: `mobile_user`, `institutional_client`, `org_collaborator`, `admin`.
    Resource access is additionally scoped by organization membership. The
    backend always validates permissions; clients must not assume otherwise.

    ## Errors
    Errors share a single envelope (`ErrorResponse`). `403` is returned when the
    caller is authenticated but lacks permission (including cross-user or
    cross-organization access).
  contact:
    name: Abudemy backend
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Auth
  - name: Users
  - name: Services
  - name: Activities
  - name: Opportunities
  - name: Assistance
  - name: Organizations
  - name: Analytics
  - name: Notifications
  - name: Assistant
  - name: Geo
  - name: Payments
  - name: Health

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      tags: [Health]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
  /readyz:
    get:
      tags: [Health]
      summary: Readiness probe (checks the database)
      security: []
      responses:
        "200":
          description: Service is ready
        "500":
          $ref: "#/components/responses/InternalError"

  # ------------------------------------------------------------------ Auth
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a new account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, full_name]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 72, description: At least one letter and one digit; 72 is bcrypt's byte limit }
                full_name: { type: string }
                phone: { type: string }
                birth_date: { type: string, format: date }
                comuna: { type: string, example: Concepción }
                health_system:
                  type: string
                  enum: [fonasa, isapre, capredena, dipreca, private, other]
                  description: Health coverage declared by the person.
                sex:
                  type: string
                  enum: [female, male, other, prefer_not_to_say]
                living_situation:
                  type: string
                  enum:
                    - alone
                    - with_partner
                    - with_children
                    - with_partner_and_children
                    - with_family
                    - with_caregiver
                    - other
                  description: Who the person lives with.
                role:
                  type: string
                  enum: [mobile_user, institutional_client]
                  default: mobile_user
                  description: |
                    Institutional clients are created with `institutional_approved=false`
                    and must be approved by an administrator before using the portal.
      responses:
        "201":
          description: Created account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Sign in and obtain a token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Token pair
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate a refresh token for a new token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current session
      responses:
        "204": { description: Session revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/logout-all:
    post:
      tags: [Auth]
      summary: Revoke every session of the caller
      responses:
        "204": { description: All sessions revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/sessions:
    get:
      tags: [Auth]
      summary: List the caller's sessions
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/sessions/{id}:
    delete:
      tags: [Auth]
      summary: Revoke one of the caller's sessions
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204": { description: Session revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/auth/password/forgot:
    post:
      tags: [Auth]
      summary: Request a password reset
      description: |
        Always returns 202 regardless of whether the email exists. The reset
        token is dispatched through the configured notification provider; when
        no provider is configured the token is stored but not delivered.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202": { description: Request accepted }
        "400": { $ref: "#/components/responses/ValidationError" }
  /api/v1/auth/password/reset:
    post:
      tags: [Auth]
      summary: Reset a password with a valid token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: { type: string }
                new_password: { type: string, minLength: 8, maxLength: 72 }
      responses:
        "204": { description: Password updated }
        "400": { $ref: "#/components/responses/ValidationError" }

  # ------------------------------------------------------------------ Users
  /api/v1/users:
    get:
      tags: [Users]
      summary: List users (administrator only)
      parameters:
        - { name: role, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
        - { name: comuna, in: query, schema: { type: string } }
        - name: health_system
          in: query
          schema:
            type: string
            enum: [fonasa, isapre, capredena, dipreca, private, other]
        - name: sex
          in: query
          schema:
            type: string
            enum: [female, male, other, prefer_not_to_say]
        - name: living_situation
          in: query
          schema:
            type: string
            enum:
              - alone
              - with_partner
              - with_children
              - with_partner_and_children
              - with_family
              - with_caregiver
              - other
        - name: age_min
          in: query
          description: Minimum completed age in years, computed from birth_date.
          schema: { type: integer, minimum: 0, maximum: 120 }
        - name: age_max
          in: query
          description: Maximum completed age in years, computed from birth_date.
          schema: { type: integer, minimum: 0, maximum: 120 }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated users
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/users/me:
    get:
      tags: [Users]
      summary: Get the caller's profile
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
    patch:
      tags: [Users]
      summary: Update the caller's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name]
              properties:
                full_name: { type: string }
                phone: { type: string }
                birth_date: { type: string, format: date }
                comuna: { type: string }
                health_system:
                  type: string
                  enum: [fonasa, isapre, capredena, dipreca, private, other]
                sex:
                  type: string
                  enum: [female, male, other, prefer_not_to_say]
                living_situation:
                  type: string
                  enum:
                    - alone
                    - with_partner
                    - with_children
                    - with_partner_and_children
                    - with_family
                    - with_caregiver
                    - other
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/ValidationError" }
  /api/v1/users/me/password:
    post:
      tags: [Users]
      summary: Change the caller's password
      description: Revokes every active session on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 8, maxLength: 72 }
      responses:
        "204": { description: Password changed }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/users/me/enrollments:
    get:
      tags: [Activities]
      summary: List the caller's activity enrollments
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated enrollments
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Enrollment" }
  /api/v1/users/me/skills:
    get:
      tags: [Opportunities]
      summary: List the caller's skills
      responses:
        "200":
          description: Skills
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Skill" }
    post:
      tags: [Opportunities]
      summary: Add a skill to the caller's profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SkillInput" }
      responses:
        "201":
          description: Created skill
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Skill" }
        "400": { $ref: "#/components/responses/ValidationError" }
  /api/v1/users/{id}:
    get:
      tags: [Users]
      summary: Get a user (self or administrator)
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: User
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/users/{id}/status:
    patch:
      tags: [Users]
      summary: Update a user's status (administrator only)
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, inactive, suspended] }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/users/{id}/role:
    patch:
      tags: [Users]
      summary: Update a user's role (administrator only)
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [mobile_user, institutional_client, org_collaborator, admin]
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/users/{id}/institutional-approval:
    patch:
      tags: [Users]
      summary: Approve or revoke institutional portal access (administrator only)
      description: |
        Only applies to `institutional_client` accounts. The change takes effect on the
        account's next request, without waiting for its access token to expire.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approved]
              properties:
                approved: { type: boolean }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # --------------------------------------------------------------- Services
  /api/v1/service-categories:
    get:
      tags: [Services]
      summary: List service categories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ServiceCategory" }
  /api/v1/services:
    get:
      tags: [Services]
      summary: Search services
      parameters:
        - { name: category_id, in: query, schema: { type: string, format: uuid } }
        - { name: type, in: query, schema: { type: string, enum: [establishment, resource] } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive, draft] } }
        - { name: comuna, in: query, schema: { type: string } }
        - { name: region, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
        - { name: organization_id, in: query, schema: { type: string, format: uuid } }
        - { name: lat, in: query, description: Latitude for proximity search, schema: { type: number } }
        - { name: lng, in: query, description: Longitude for proximity search, schema: { type: number } }
        - { name: radius_km, in: query, description: Radius in kilometres, schema: { type: number } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated services (ordered by distance when lat/lng/radius_km are provided)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Service" }
    post:
      tags: [Services]
      summary: Create a service
      description: Requires an administrator role or a write role in the target organization.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceInput" }
      responses:
        "201":
          description: Created service
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Service" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/services/{id}:
    get:
      tags: [Services]
      summary: Get a service
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Service
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Service" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Services]
      summary: Update a service
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceInput" }
      responses:
        "200":
          description: Updated service
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Service" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Services]
      summary: Delete a service
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/services/{id}/status:
    patch:
      tags: [Services]
      summary: Activate or deactivate a service
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, inactive, draft] }
      responses:
        "200":
          description: Updated service
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Service" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # -------------------------------------------------------------- Activities
  /api/v1/activities:
    get:
      tags: [Activities]
      summary: Search activities
      parameters:
        - { name: type, in: query, schema: { type: string, enum: [workshop, event, course, support_group] } }
        - { name: status, in: query, schema: { type: string, enum: [draft, published, cancelled, finished] } }
        - { name: modality, in: query, schema: { type: string, enum: [in_person, online, hybrid] } }
        - { name: comuna, in: query, schema: { type: string } }
        - { name: region, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
        - { name: organization_id, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated activities
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Activity" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Activities]
      summary: Create an activity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActivityInput" }
      responses:
        "201":
          description: Created activity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Activity" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/activities/{id}:
    get:
      tags: [Activities]
      summary: Get an activity
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Activity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Activity" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Activities]
      summary: Update an activity
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActivityInput" }
      responses:
        "200":
          description: Updated activity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Activity" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/activities/{id}/status:
    patch:
      tags: [Activities]
      summary: Change an activity's status
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [draft, published, cancelled, finished] }
      responses:
        "200":
          description: Updated activity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Activity" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/activities/{id}/enrollments:
    get:
      tags: [Activities]
      summary: List an activity's enrollments (manager or administrator)
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated enrollments
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Enrollment" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Activities]
      summary: Enroll the caller in an activity
      description: |
        Capacity is enforced transactionally with a row lock on the activity.
        When the activity is full the enrollment is created with status
        `waitlist`. Enrolling twice returns 409. Only a `cancelled` enrollment
        can be reactivated; an `attended` enrollment is kept as-is and also
        returns 409.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "201":
          description: Enrollment result
          content:
            application/json:
              schema:
                type: object
                properties:
                  enrollment: { $ref: "#/components/schemas/Enrollment" }
                  waitlisted: { type: boolean }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/activities/{id}/enrollments/me:
    delete:
      tags: [Activities]
      summary: Cancel the caller's enrollment
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204": { description: Enrollment cancelled }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/activities/{id}/enrollments/{userId}:
    patch:
      tags: [Activities]
      summary: Update an enrollment's status (manager or administrator)
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [enrolled, waitlist, cancelled, attended] }
      responses:
        "204": { description: Updated }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ----------------------------------------------------------- Opportunities
  /api/v1/skills/{id}:
    put:
      tags: [Opportunities]
      summary: Update a skill
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SkillInput" }
      responses:
        "200":
          description: Updated skill
          content:
            application/json:
